<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MA-NGA - Informations de profil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white min-h-screen relative pb-40">

  <!-- ✅ Fond Montagne derrière les boutons -->
  <div class="absolute top-[35%] left-1/2 transform -translate-x-1/2 w-full sm:w-4/5 md:w-3/5 h-96 opacity-70 z-0"
       style="background: linear-gradient(to top, #8fbc8f 0%, #c1f8c1 40%, #bef5c7 100%);"></div>

  <!-- ✅ Header -->
  <div class="flex justify-between items-center p-3 sm:p-4 relative z-10">
    <div class="text-lg sm:text-xl font-bold text-gray-800">9.41</div>
    <div class="flex space-x-1 sm:space-x-2 border-2 border-green-500 rounded-lg p-1 sm:p-2">
      <a href="#" class="text-gray-600 text-base"><i class="fas fa-envelope"></i></a>
      <div class="h-6 w-px bg-green-500"></div>
      <a href="#" class="text-white bg-green-500 rounded-full p-1 text-base"><i class="fas fa-user"></i></a>
      <div class="h-6 w-px bg-green-500"></div>
      <a href="#" class="text-gray-600 text-base"><i class="fas fa-home"></i></a>
      <div class="h-6 w-px bg-green-500"></div>
      <a href="#" class="text-gray-600 text-base"><i class="fas fa-bars"></i></a>
    </div>
  </div>

  <!-- ✅ Logo -->
  <div class="flex justify-center mt-2 relative z-10">
    <div class="w-20 h-20 overflow-hidden bg-white">
      <img src="../assets/images/bg-montagne.png" alt="MA-NGA Logo" class="w-full h-full object-cover">
    </div>
  </div>

  <!-- ✅ Barre de progression -->
  <div class="flex justify-center mt-2 relative z-10">
    <div class="w-4/5 sm:w-3/5 md:w-1/2 lg:w-2/5 bg-gray-300 rounded-full h-3">
      <div class="bg-green-500 h-3 rounded-full" style="width: 30%;"></div>
    </div>
  </div>

  <!-- ✅ Titre -->
  <div class="text-center mt-4 px-4 relative z-10">
    <h1 class="text-red-600 font-bold text-base sm:text-lg mb-1">VOS INFORMATIONS DE PROFIL MA-NGU</h1>
    <h2 class="text-[#210C4A] font-bold text-lg sm:text-xl mb-4">Le membre de votre famille le plus proche ?</h2>
  </div>

  <!-- ✅ Boutons disposés comme l’image -->
  <div class="relative z-10 max-w-2xl mx-auto space-y-2 text-center text-white font-semibold text-sm sm:text-base px-4">

    <!-- Ligne 1 -->
    <div class="flex justify-center gap-2 flex-wrap">
      <button class="bg-red-600 px-4 py-2 rounded-lg">Père</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Mère</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Frere</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Soeur</button>
      <button class="bg-red-400 px-4 py-2 rounded-lg">Oncle</button>
      <button class="bg-red-400 px-4 py-2 rounded-lg">Tante</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Cousine</button>
    </div>

    <!-- Ligne 2 -->
    <div class="flex justify-center gap-2 flex-wrap">
      <button class="bg-red-400 px-4 py-2 rounded-lg">Cousin</button>
      <button class="bg-red-400 px-4 py-2 rounded-lg">Belle-famille</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Neveu</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Niece</button>
      <button class="bg-red-600 px-4 py-2 rounded-lg">Grand-Mère M</button>
    </div>

    <!-- Ligne 3 -->
    <div class="flex justify-center gap-2 flex-wrap">
      <button class="bg-red-400 px-4 py-2 rounded-lg">Grand-Père M</button>
      <button class="bg-red-400 px-4 py-2 rounded-lg">Grand-Père P</button>
      <button class="bg-red-400 px-4 py-2 rounded-lg">Grand-Mère P</button>
      <button class="bg-red-200 px-4 py-2 rounded-lg text-white">Autre</button>
    </div>

  </div>

  <!-- ✅ Points de progression -->
  <div class="flex justify-center space-x-2 mt-6 relative z-10">
    <div class="w-3 h-3 bg-red-600 rounded-full"></div>
    <div class="w-3 h-3 bg-red-600 rounded-full"></div>
    <div class="w-3 h-3 bg-red-300 rounded-full"></div>
    <div class="w-3 h-3 bg-red-300 rounded-full"></div>
    <div class="w-3 h-3 bg-red-300 rounded-full"></div>
  </div>

  <!-- ✅ Bouton Suivant -->
  <div class="mt-6 sm:mt-8 mb-10 px-6 relative z-10">
    <button class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-full text-lg sm:text-xl transition-colors">
      Suivant
    </button>
  </div>

</body>
</html>
